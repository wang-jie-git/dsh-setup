# dsh 核心插件配置（2026-09-07 修复 duplicate loader entry 错误后重建）
# 原则：bundles 里的包自带 cordis.patch.yml（自动应用），根配置只保留
#      非 bundle 插件（本地路径 / 非 bundle 包），避免重复注册。

# 管理页面（本地插件，非 bundle）
- insert:
    - id: dsh-memory-manager
      name: './plugins/dsh-memory-manager/src/index.js'
      config:
        codegraphDir: '/Users/mac/.local/share/ai-memory'
# AI Memory MCP（非 bundle 包）
- insert:
    - id: mcp-ai-memory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ai-memory
        transport: stdio
        command: node
        args:
          [
            '/Users/mac/Desktop/AI-memory/dist/ai-memory-mcp.mjs',
            '--codegraph-dir',
            '/Users/mac/.local/share/ai-memory',
            '--embedder',
            'api',
            '--embedder-base-url',
            'https://api.jina.ai/v1',
            '--embedder-model',
            'jina-embeddings-v3'
          ]
        toolCallTimeoutMs: 30000
# Obsidian 读写 MCP（filesystem 直读 vault；方案 A 无 TLS 证书问题；2026-09-25 从 fresh profile 移植）
- insert:
    - id: mcp-obsidian-vault
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: obsidian
        transport: stdio
        command: /usr/local/bin/mcp-server-filesystem
        args: [ '/Users/mac/Documents/ObsidianVault' ]
        toolCallTimeoutMs: 30000
        failOnStartupError: false
# dsh-media MCP（语音转文字 SenseVoice + 视频抽帧 ffmpeg；2026-09-26 新增）
- insert:
    - id: mcp-dsh-media
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: dsh_media
        transport: stdio
        command: /Users/mac/Desktop/nexus-browser/.venv/bin/python3
        args: [ '/Users/mac/Desktop/dsh-media-mcp/server.py' ]
        toolCallTimeoutMs: 600000
        failOnStartupError: false
# 网页搜索（本地插件，非 bundle；2026-09-07 排除"贴图报错"嫌疑，已证明与 wigolo 无关）
- insert:
    - id: dsh-web-search-wigolo
      name: './plugins/dsh-web-search-wigolo/src/index.js'
# nexus-browser 使用引导 skill（本地插件，非 bundle；17 个 MCP 工具决策树；2026-09-11 从 backup 恢复）
- insert:
    - id: dsh-nexus-browser-guide
      name: './plugins/dsh-nexus-browser-guide/src/index.js'
# nexus-browser 浏览器 MCP（151+ 站点；REST 桥接为 stdio MCP）
- insert:
    - id: mcp-nexus-browser
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: nexus_browser
        transport: stdio
        command: /Users/mac/Desktop/nexus-browser/.venv/bin/python3
        args: [ '/Users/mac/Desktop/nexus-browser/mcp_server.py' ]
        toolCallTimeoutMs: 60000
# wigolo 网页智能 MCP（8 工具：search/fetch/crawl/cache/extract/find_similar/research/agent）
- insert:
    - id: mcp-wigolo
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: wigolo
        transport: stdio
        command: /Users/mac/.npm-global/bin/wigolo
        args: []
        toolCallTimeoutMs: 60000
# ghidra 逆向 MCP（部署在联想笔记本 ziqian-laptop；SSH stdio 跨机调用；2026-10-12 新增）
# 工具: re_analyze / re_decompile / re_strings；每文件首次分析 30-60s，之后复用 /tmp/re_workspace 缓存
- insert:
    - id: mcp-ghidra-re
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ghidra_re
        transport: stdio
        command: ssh
        args:
          [
            '-o',
            'ConnectTimeout=10',
            'ziqian-laptop',
            '/home/ziqian/re-mcp/start.sh'
          ]
        toolCallTimeoutMs: 600000
        failOnStartupError: false
# REA 本地逆向 MCP（Mac 本机 npx rea-agents；Ghidra 12.1.4 + mac decompiler 自编译；2026-10-14 新增）
# 与 mcp-ghidra-re（SSH 远程）并存，serverName 独立；工具: open_binary / list_strings / procedure_pseudo_code 等
- insert:
    - id: mcp-rea-local
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: rea
        transport: stdio
        command: /usr/local/bin/npx
        args: [ '-y', 'rea-agents@latest', 'mcp' ]
        env:
          GHIDRA_INSTALL_DIR: /Users/mac/Applications/ghidra_12.1.4_PUBLIC
          JAVA_HOME: /Users/mac/Applications/jdk-21/Contents/Home
          REA_MCP_INPUT_SCHEMA_PROFILE: compact
        toolCallTimeoutMs: 600000
        failOnStartupError: false
# [2026-10-19 恢复] 回到 10-03 前设置：deepseek-v4-flash/glm-5.2 contextWindow 恢复 1M，
# 避免 262144 窗口过早压缩导致长任务输出截断/行为异常。
